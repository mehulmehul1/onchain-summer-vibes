<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onchain Summer Vibes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: transparent;
            min-height: 100vh;
            overflow: hidden;
        }
        
        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: transparent;
        }
        
        /* Loading indicator */
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            color: white;
            font-size: 18px;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .loading.visible {
            opacity: 1;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div class="loading" id="loading">
        Generating artwork...
    </div>

    <script type="module">
        import { Q5AppMint } from './src/core/Q5AppMint.js';
        import { PATTERN_TYPES } from './src/constants/patternConfig.js';
        
        let app = null;
        
        // DOM elements
        const canvas = document.getElementById('canvas');
        const loading = document.getElementById('loading');
        
        // Override to use random dark theme color
        class TransparentQ5AppMint extends Q5AppMint {
            draw(elapsed) {
                if (!this.ctx || !this.canvas) return;
                
                const { width, height } = this.canvas;
                
                // Use random theme color selected at initialization
                const bgColor = this.getRandomThemeColor();
                this.ctx.fillStyle = `rgb(${bgColor[0]}, ${bgColor[1]}, ${bgColor[2]})`;
                this.ctx.fillRect(0, 0, width, height);
                
                // Draw black border (backgroundPath) - SOLID BLACK, NO PATTERN
                this.drawLogoBackground();
                
                // Render pattern ONLY inside white letterforms (path)
                this.renderWithSVGClip(elapsed);
            }
        }
        
        // Show loading
        function showLoading() {
            loading.classList.add('visible');
        }
        
        // Hide loading
        function hideLoading() {
            loading.classList.remove('visible');
        }
        
        // Initialize artwork
        async function initializeArtwork() {
            try {
                showLoading();
                
                // Small delay for loading display
                await new Promise(resolve => setTimeout(resolve, 100));
                
                // Create new app instance with random parameters
                if (app) {
                    app.initialized = false;
                }
                
                app = new TransparentQ5AppMint();
                await app.initialize(canvas);
                
                hideLoading();
                
                console.log('🎨 Onchain Summer Vibes Generated');
                console.log('Pattern:', app.tokenTraits?.Pattern || 'Unknown');
                console.log('Theme:', app.tokenTraits?.Theme || 'Unknown');
                console.log('Rarity:', app.tokenTraits?.Rarity || 'Unknown');
                
            } catch (error) {
                console.error('Failed to generate artwork:', error);
                hideLoading();
                
                // Try again after a short delay
                setTimeout(initializeArtwork, 1000);
            }
        }
        
        // Handle window resize
        window.addEventListener('resize', () => {
            if (app && app.canvas) {
                app.canvas.width = window.innerWidth;
                app.canvas.height = window.innerHeight;
            }
        });
        
        // Batch generation state
        let batchGeneration = {
            running: false,
            count: 0,
            total: 0
        };
        
        // Add keyboard shortcuts
        document.addEventListener('keydown', (event) => {
            // Save with S key
            if (event.key.toLowerCase() === 's') {
                event.preventDefault(); // Prevent browser default save dialog
                if (app) {
                    app.saveAsPNG();
                }
            }
            
            // Reload with Spacebar
            if (event.code === 'Space') {
                event.preventDefault(); // Prevent page scroll
                if (!batchGeneration.running) {
                    initializeArtwork();
                }
            }
            
            // Start batch generation with B key
            if (event.key.toLowerCase() === 'b') {
                event.preventDefault();
                if (!batchGeneration.running) {
                    startBatchGeneration();
                }
            }
            
            // Stop batch generation with Escape
            if (event.key === 'Escape') {
                event.preventDefault();
                if (batchGeneration.running) {
                    stopBatchGeneration();
                }
            }
        });
        
        // Start automated batch generation
        async function startBatchGeneration(count = 100) {
            if (batchGeneration.running) return;
            
            console.log(`🚀 Starting batch generation: ${count} artworks`);
            console.log('Press ESC to stop batch generation');
            
            batchGeneration.running = true;
            batchGeneration.count = 0;
            batchGeneration.total = count;
            
            // Update page title to show progress
            const originalTitle = document.title;
            
            for (let i = 1; i <= count && batchGeneration.running; i++) {
                try {
                    // Update progress
                    batchGeneration.count = i;
                    document.title = `[${i}/${count}] Generating Onchain Summer Vibes`;
                    console.log(`📸 Generating artwork ${i}/${count}`);
                    
                    // Generate new artwork
                    await initializeArtwork();
                    
                    // Wait for artwork to fully render
                    await new Promise(resolve => setTimeout(resolve, 5000));
                    
                    // Save the artwork
                    if (app && batchGeneration.running) {
                        // Add batch number to filename
                        const originalSave = app.saveAsPNG;
                        app.saveAsPNG = function() {
                            if (!this.canvas) return;
                            
                            try {
                                const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
                                const patternName = this.tokenTraits?.Pattern || 'Unknown';
                                const themeName = this.tokenTraits?.Theme || 'Unknown';
                                const batchNum = String(i).padStart(3, '0');
                                const filename = `OnchainSummerVibes_${batchNum}_${patternName}_${themeName}_${timestamp}.png`;
                                
                                const link = document.createElement('a');
                                link.download = filename;
                                link.href = this.canvas.toDataURL('image/png', 1.0);
                                
                                document.body.appendChild(link);
                                link.click();
                                document.body.removeChild(link);
                                
                                console.log(`✅ Saved: ${filename}`);
                                
                            } catch (error) {
                                console.error('Failed to save PNG:', error);
                            }
                        };
                        
                        app.saveAsPNG();
                        app.saveAsPNG = originalSave; // Restore original method
                    }
                    
                    // Small delay before next iteration
                    await new Promise(resolve => setTimeout(resolve, 500));
                    
                } catch (error) {
                    console.error(`Error generating artwork ${i}:`, error);
                }
            }
            
            // Restore original title
            document.title = originalTitle;
            
            if (batchGeneration.running) {
                console.log(`🎉 Batch generation complete! Generated ${batchGeneration.count} artworks`);
            } else {
                console.log(`⏹️ Batch generation stopped at ${batchGeneration.count}/${batchGeneration.total}`);
            }
            
            batchGeneration.running = false;
            batchGeneration.count = 0;
            batchGeneration.total = 0;
        }
        
        // Stop batch generation
        function stopBatchGeneration() {
            if (batchGeneration.running) {
                console.log('⏹️ Stopping batch generation...');
                batchGeneration.running = false;
            }
        }
        
        // Initialize when page loads
        window.addEventListener('load', initializeArtwork);
        
        // Add console signature
        console.log('🎨 Onchain Summer Vibes - Generative Art Collection');
        console.log('🌈 Each refresh generates a unique artwork with randomized patterns, themes, and parameters');
        console.log('⭐ Built for Highlight.xyz NFT minting');
    </script>
</body>
</html>
