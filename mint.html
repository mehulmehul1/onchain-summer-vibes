<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onchain Summer Vibes - Mint Simulation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow: hidden;
        }
        
        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: crosshair;
        }
        
        .mint-ui {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: flex-end;
        }
        
        .randomize-btn {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            border: none;
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(238, 90, 36, 0.3);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }
        
        .randomize-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(238, 90, 36, 0.4);
            background: linear-gradient(135deg, #ee5a24, #ff6b6b);
        }
        
        .randomize-btn:active {
            transform: translateY(0);
        }
        
        .randomize-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        
        .randomize-btn:hover::before {
            left: 100%;
        }
        
        .trait-display {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            color: white;
            min-width: 280px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .trait-display h3 {
            margin-bottom: 15px;
            color: #ff6b6b;
            font-size: 18px;
            font-weight: 600;
            text-align: center;
        }
        
        .trait-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            padding: 5px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .trait-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }
        
        .trait-label {
            font-weight: 500;
            color: #ccc;
        }
        
        .trait-value {
            font-weight: 600;
            color: white;
        }
        
        .rarity-common { color: #95a5a6; }
        .rarity-uncommon { color: #3498db; }
        .rarity-rare { color: #9b59b6; }
        .rarity-epic { color: #f39c12; }
        
        .loading {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2000;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 20px 40px;
            border-radius: 15px;
            font-size: 18px;
            font-weight: 600;
        }
        
        .mint-count {
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 500;
            backdrop-filter: blur(5px);
        }
        
        .pattern-selector {
            margin-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 15px;
        }
        
        .pattern-selector-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            margin-bottom: 10px;
        }
        
        .pattern-selector-header h4 {
            color: #ff6b6b;
            font-size: 14px;
            font-weight: 600;
            margin: 0;
        }
        
        .dropdown-arrow {
            color: #ccc;
            transition: transform 0.3s ease;
        }
        
        .dropdown-arrow.expanded {
            transform: rotate(180deg);
        }
        
        .pattern-list {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }
        
        .pattern-list.expanded {
            max-height: 300px;
        }
        
        .pattern-checkbox {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            cursor: pointer;
            padding: 5px;
            border-radius: 5px;
            transition: background-color 0.2s ease;
        }
        
        .pattern-checkbox:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
        
        .pattern-checkbox input[type="checkbox"] {
            margin-right: 8px;
            width: 16px;
            height: 16px;
            accent-color: #ff6b6b;
        }
        
        .pattern-checkbox label {
            font-size: 13px;
            color: #ccc;
            cursor: pointer;
            flex: 1;
        }
        
        .pattern-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .pattern-btn {
            flex: 1;
            background: rgba(255, 107, 107, 0.2);
            border: 1px solid #ff6b6b;
            color: #ff6b6b;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .pattern-btn:hover {
            background: rgba(255, 107, 107, 0.3);
        }
        
        .selected-count {
            font-size: 11px;
            color: #888;
            text-align: center;
            margin-top: 5px;
        }
        
        @media (max-width: 768px) {
            .mint-ui {
                top: 10px;
                right: 10px;
                gap: 10px;
            }
            
            .randomize-btn {
                padding: 12px 24px;
                font-size: 14px;
            }
            
            .trait-display {
                min-width: 240px;
                padding: 15px;
            }
            
            .trait-display h3 {
                font-size: 16px;
            }
        }
        
        /* Pulse animation for minting */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .minting {
            animation: pulse 1s infinite;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div class="mint-ui">
        <div class="mint-count">
            <span>Mints Generated: </span>
            <span id="mintCounter">0</span>
        </div>
        
        <div class="trait-display" id="traitDisplay">
            <h3>🎨 Current Artwork</h3>
            <div class="trait-item">
                <span class="trait-label">Pattern:</span>
                <span class="trait-value" id="traitPattern">-</span>
            </div>
            <div class="trait-item">
                <span class="trait-label">Theme:</span>
                <span class="trait-value" id="traitTheme">-</span>
            </div>
            <div class="trait-item">
                <span class="trait-label">Rarity:</span>
                <span class="trait-value" id="traitRarity">-</span>
            </div>
            <div class="trait-item">
                <span class="trait-label">Speed:</span>
                <span class="trait-value" id="traitSpeed">-</span>
            </div>
            <div class="trait-item">
                <span class="trait-label">Complexity:</span>
                <span class="trait-value" id="traitComplexity">-</span>
            </div>
            
            <div class="pattern-selector">
                <div class="pattern-selector-header" id="patternSelectorHeader">
                    <h4>🎭 Pattern Filter</h4>
                    <span class="dropdown-arrow" id="dropdownArrow">▼</span>
                </div>
                <div class="pattern-list" id="patternList">
                    <div class="pattern-checkbox">
                        <input type="checkbox" id="pattern-interference" value="interference" checked>
                        <label for="pattern-interference">Interference</label>
                    </div>
                    <div class="pattern-checkbox">
                        <input type="checkbox" id="pattern-gentle" value="gentle" checked>
                        <label for="pattern-gentle">Gentle Waves</label>
                    </div>
                    <div class="pattern-checkbox">
                        <input type="checkbox" id="pattern-mandala" value="mandala" checked>
                        <label for="pattern-mandala">Sacred Mandala</label>
                    </div>
                    <div class="pattern-checkbox">
                        <input type="checkbox" id="pattern-vectorfield" value="vectorfield" checked>
                        <label for="pattern-vectorfield">Vector Flow</label>
                    </div>
                    <div class="pattern-checkbox">
                        <input type="checkbox" id="pattern-shellridge" value="shellridge" checked>
                        <label for="pattern-shellridge">Shell Ridges</label>
                    </div>
                    <div class="pattern-checkbox">
                        <input type="checkbox" id="pattern-contourinterference" value="contourinterference" checked>
                        <label for="pattern-contourinterference">Contour Waves</label>
                    </div>
                    <div class="pattern-checkbox">
                        <input type="checkbox" id="pattern-voronoi" value="voronoi" checked>
                        <label for="pattern-voronoi">Voronoi Cells</label>
                    </div>
                    <div class="pattern-checkbox">
                        <input type="checkbox" id="pattern-risoprint" value="risoprint" checked>
                        <label for="pattern-risoprint">RISO Print</label>
                    </div>
                    <div class="pattern-checkbox">
                        <input type="checkbox" id="pattern-radialgrowth" value="radialgrowth" checked>
                        <label for="pattern-radialgrowth">Radial Growth</label>
                    </div>
                    <div class="pattern-checkbox">
                        <input type="checkbox" id="pattern-flame" value="flame" checked>
                        <label for="pattern-flame">Living Flames</label>
                    </div>
                    <div class="pattern-actions">
                        <button class="pattern-btn" id="selectAllBtn">Select All</button>
                        <button class="pattern-btn" id="deselectAllBtn">Deselect All</button>
                    </div>
                    <div class="selected-count" id="selectedCount">10 of 10 patterns selected</div>
                </div>
            </div>
        </div>
        
        <button class="randomize-btn" id="randomizeBtn">
            🎲 Generate New Art
        </button>
    </div>
    
    <div class="loading" id="loading">
        Generating new artwork...
    </div>

    <script type="module">
        import { Q5AppMint } from './src/core/Q5AppMint.js';
        import { PATTERN_TYPES } from './src/constants/patternConfig.js';
        
        let app = null;
        let mintCount = 0;
        
        // DOM elements
        const canvas = document.getElementById('canvas');
        const randomizeBtn = document.getElementById('randomizeBtn');
        const loading = document.getElementById('loading');
        const mintCounter = document.getElementById('mintCounter');
        
        // Trait display elements
        const traitPattern = document.getElementById('traitPattern');
        const traitTheme = document.getElementById('traitTheme');
        const traitRarity = document.getElementById('traitRarity');
        const traitSpeed = document.getElementById('traitSpeed');
        const traitComplexity = document.getElementById('traitComplexity');
        
        // Pattern selector elements
        const patternSelectorHeader = document.getElementById('patternSelectorHeader');
        const dropdownArrow = document.getElementById('dropdownArrow');
        const patternList = document.getElementById('patternList');
        const selectAllBtn = document.getElementById('selectAllBtn');
        const deselectAllBtn = document.getElementById('deselectAllBtn');
        const selectedCount = document.getElementById('selectedCount');
        
        // Pattern filtering state
        let enabledPatterns = new Set([
            'interference', 'gentle', 'mandala', 'vectorfield', 
            'shellridge', 'contourinterference', 'voronoi', 
            'risoprint', 'radialgrowth', 'flame'
        ]);
        
        // Pattern selector functions
        function toggleDropdown() {
            const isExpanded = patternList.classList.contains('expanded');
            if (isExpanded) {
                patternList.classList.remove('expanded');
                dropdownArrow.classList.remove('expanded');
            } else {
                patternList.classList.add('expanded');
                dropdownArrow.classList.add('expanded');
            }
        }
        
        function updatePatternCount() {
            const checkboxes = patternList.querySelectorAll('input[type="checkbox"]');
            const checkedCount = Array.from(checkboxes).filter(cb => cb.checked).length;
            selectedCount.textContent = `${checkedCount} of ${checkboxes.length} patterns selected`;
            
            // Update enabled patterns set
            enabledPatterns.clear();
            checkboxes.forEach(checkbox => {
                if (checkbox.checked) {
                    enabledPatterns.add(checkbox.value);
                }
            });
        }
        
        function selectAllPatterns() {
            const checkboxes = patternList.querySelectorAll('input[type="checkbox"]');
            checkboxes.forEach(checkbox => {
                checkbox.checked = true;
            });
            updatePatternCount();
        }
        
        function deselectAllPatterns() {
            const checkboxes = patternList.querySelectorAll('input[type="checkbox"]');
            checkboxes.forEach(checkbox => {
                checkbox.checked = false;
            });
            updatePatternCount();
        }
        
        // Create custom Q5AppMint class with pattern filtering
        class FilteredQ5AppMint extends Q5AppMint {
            initializeMintParameters() {
                // Get available patterns based on enabled filters
                const availablePatterns = Object.values(PATTERN_TYPES).filter(pattern => enabledPatterns.has(pattern));
                
                if (availablePatterns.length === 0) {
                    // Fallback to all patterns if none selected
                    super.initializeMintParameters();
                    return;
                }
                
                // Use original logic but restrict to enabled patterns
                this.patternType = availablePatterns[Math.floor(Math.random() * availablePatterns.length)];
                
                // Continue with original initialization for theme and other parameters
                this.currentTheme = this.selectRandomTheme();
                
                const themeData = this.getThemeData(this.currentTheme);
                this.colors = {
                    primary: this.hexToRgb(themeData.color1),
                    secondary: this.hexToRgb(themeData.color2),
                    accent: this.hexToRgb(themeData.color3),
                    background: this.hexToRgb(themeData.color4)
                };
                this.themeRarity = themeData.rarity;
                
                this.randomizePatternParameters();
                this.generateTokenTraits();
            }
        }
        
        // Initialize first artwork
        async function initializeApp() {
            try {
                app = new FilteredQ5AppMint();
                await app.initialize(canvas);
                updateTraitDisplay();
                mintCount++;
                mintCounter.textContent = mintCount;
                
                // Initialize pattern selector UI
                initializePatternSelector();
            } catch (error) {
                console.error('Failed to initialize app:', error);
                alert('Failed to load artwork. Please refresh the page.');
            }
        }
        
        // Initialize pattern selector UI
        function initializePatternSelector() {
            // Toggle dropdown functionality
            patternSelectorHeader.addEventListener('click', toggleDropdown);
            
            // Select/Deselect all buttons
            selectAllBtn.addEventListener('click', selectAllPatterns);
            deselectAllBtn.addEventListener('click', deselectAllPatterns);
            
            // Checkbox change listeners
            const checkboxes = patternList.querySelectorAll('input[type="checkbox"]');
            checkboxes.forEach(checkbox => {
                checkbox.addEventListener('change', updatePatternCount);
            });
            
            // Initialize count display
            updatePatternCount();
        }
        
        // Generate new random artwork
        async function generateNewArtwork() {
            try {
                // Check if at least one pattern is selected
                if (enabledPatterns.size === 0) {
                    alert('Please select at least one pattern to generate artwork.');
                    return;
                }
                
                // Show loading
                loading.style.display = 'block';
                randomizeBtn.classList.add('minting');
                randomizeBtn.textContent = '🎨 Generating...';
                
                // Small delay for better UX
                await new Promise(resolve => setTimeout(resolve, 500));
                
                // Create new app instance with new random parameters
                if (app) {
                    // Stop current animation if possible
                    app.initialized = false;
                }
                
                app = new FilteredQ5AppMint();
                await app.initialize(canvas);
                
                // Update UI
                updateTraitDisplay();
                mintCount++;
                mintCounter.textContent = mintCount;
                
                // Hide loading
                loading.style.display = 'none';
                randomizeBtn.classList.remove('minting');
                randomizeBtn.textContent = '🎲 Generate New Art';
                
                // Add a little celebration effect
                randomizeBtn.style.transform = 'scale(1.1)';
                setTimeout(() => {
                    randomizeBtn.style.transform = '';
                }, 200);
                
            } catch (error) {
                console.error('Failed to generate new artwork:', error);
                loading.style.display = 'none';
                randomizeBtn.classList.remove('minting');
                randomizeBtn.textContent = '🎲 Generate New Art';
                alert('Failed to generate new artwork. Please try again.');
            }
        }
        
        // Update trait display
        function updateTraitDisplay() {
            if (!app || !app.tokenTraits) return;
            
            const traits = app.tokenTraits;
            
            traitPattern.textContent = traits.Pattern || '-';
            traitTheme.textContent = traits.Theme || '-';
            traitSpeed.textContent = traits['Animation Speed'] || '-';
            traitComplexity.textContent = traits.Complexity || '-';
            
            // Update rarity with color coding
            const rarity = traits.Rarity || '-';
            traitRarity.textContent = rarity;
            traitRarity.className = 'trait-value rarity-' + rarity.toLowerCase();
        }
        
        // Event listeners
        randomizeBtn.addEventListener('click', generateNewArtwork);
        
        // Keyboard shortcut (spacebar to randomize)
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !randomizeBtn.classList.contains('minting')) {
                e.preventDefault();
                generateNewArtwork();
            }
        });
        
        // Handle window resize
        window.addEventListener('resize', () => {
            if (app && app.canvas) {
                app.canvas.width = window.innerWidth;
                app.canvas.height = window.innerHeight;
            }
        });
        
        // Initialize the app when page loads
        window.addEventListener('load', initializeApp);
        
        // Add some fun console messages
        console.log('🎨 Onchain Summer Vibes - Mint Simulation');
        console.log('🎲 Press SPACEBAR or click the button to generate new art!');
        console.log('🌈 Each artwork is completely unique with randomized patterns, themes, and parameters');
    </script>
</body>
</html>
